[package]
name = "bloaty"
version = "0.1.0"
edition = "2024"
description = "Where does the code in a Rust project live, and where is it bloated?"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
# span-locations gives syn spans real line numbers outside proc macros.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "1"

[profile.release]
lto = "thin"
