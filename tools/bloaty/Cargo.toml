[package]
name = "bloaty"
version = "0.1.0"
edition = "2024"
# let-chains
rust-version = "1.88"
description = "Where does the code in a Rust project live, and where is it bloated?"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
# The tokenizer in lines/tokens.rs (parser combinators).
parsicomb = { git = "https://github.com/jonasrsv42/parsicomb", rev = "e3268562ea62f215e765d40080968badcb61cbb8" }
# span-locations gives syn spans real line numbers outside proc macros.
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
toml = "1"

[profile.release]
lto = "thin"
